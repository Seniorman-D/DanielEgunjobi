version: '3.8'

services:
  backend:
    build: ./backend
    container_name: anyiko-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend
    container_name: anyiko-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
