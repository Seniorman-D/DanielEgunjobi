<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Confirmation | Luo Ancestral Covenant</title><link rel="stylesheet" href="/styles.css"></head><body><main class="container" style="min-height:70vh;display:grid;place-items:center"><section class="panel" style="max-width:650px;text-align:center;padding:40px;border:1px solid #eadcc9;border-radius:18px"><span class="eyebrow">LUO ANCESTRAL COVENANT</span><h1 id="title">Verifying your payment…</h1><p id="message">Please wait while we confirm your transaction with the payment provider.</p><a class="btn primary" href="/">Return to Website</a></section></main><script>(async()=>{const q=new URLSearchParams(location.search);const tracking=q.get('OrderTrackingId');const reference=q.get('OrderMerchantReference');try{const r=await fetch(`/.netlify/functions/payment-status?${tracking?`tracking_id=${encodeURIComponent(tracking)}`:`reference=${encodeURIComponent(reference||'')}`}`);const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to verify payment');if(d.order.payment_status==='paid'){document.querySelector('#title').textContent='Payment Successful';document.querySelector('#message').textContent=`Thank you. Order ${d.order.order_number} has been confirmed and will now be processed.`}else{document.querySelector('#title').textContent='Payment Pending';document.querySelector('#message').textContent=`Order ${d.order.order_number} was received. Payment status: ${d.order.payment_status}. We will update you when confirmation is received.`}}catch(e){document.querySelector('#title').textContent='Payment Verification';document.querySelector('#message').textContent=e.message}})();</script></body></html>
