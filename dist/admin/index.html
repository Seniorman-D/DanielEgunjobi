<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luo Ancestral Covenant | Admin</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f7f2eb}.admin{max-width:1180px;margin:0 auto;padding:32px 20px}.panel{background:#fff;border:1px solid #eadcc9;border-radius:16px;padding:24px;box-shadow:0 10px 30px #2d160f0d}.login{max-width:430px;margin:10vh auto}.field{display:block;width:100%;box-sizing:border-box;padding:13px 14px;margin:10px 0;border:1px solid #d9c9b5;border-radius:8px}.btn{cursor:pointer}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{padding:18px;background:#fff;border:1px solid #eadcc9;border-radius:12px}.stat b{display:block;font-size:24px;margin-top:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;white-space:nowrap}select{padding:8px;border:1px solid #d9c9b5;border-radius:7px}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="admin"><section id="login" class="panel login"><span class="eyebrow">LUO ANCESTRAL COVENANT</span><h1>Admin Dashboard</h1><p>Sign in with your authorised administrator account.</p><form id="loginForm"><input class="field" id="email" type="email" placeholder="Admin email" required><input class="field" id="password" type="password" placeholder="Password" required><button class="btn primary full" type="submit">Sign In</button></form><p id="loginMsg"></p></section><section id="dashboard" class="hidden"><div class="top"><div><span class="eyebrow">CONTROL CENTRE</span><h1>Orders</h1></div><button id="logout" class="btn secondary">Sign Out</button></div><div class="stats"><div class="stat">Total Orders<b id="totalOrders">0</b></div><div class="stat">Paid Orders<b id="paidOrders">0</b></div><div class="stat">Pending<b id="pendingOrders">0</b></div><div class="stat">Revenue<b id="revenue">KSh 0</b></div></div><div class="panel table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th><th>Update</th></tr></thead><tbody id="orders"></tbody></table></div></section></main><script src="/admin/admin.js"></script></body></html>
